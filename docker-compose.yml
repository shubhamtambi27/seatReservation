services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seats
      POSTGRES_USER: seats
      POSTGRES_PASSWORD: seats
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seats -d seats"]
      interval: 2s
      timeout: 5s
      retries: 20

  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      JDBC_DATABASE_URL: jdbc:postgresql://db:5432/seats
      DB_USER: seats
      DB_PASSWORD: seats
      ADMIN_TOKEN: admin-secret
      DB_POOL_SIZE: 20
    depends_on:
      db:
        condition: service_healthy
