services:
  - type: web
    name: seat-reservation
    runtime: docker
    plan: free
    healthCheckPath: /health/live
    envVars:
      - key: ADMIN_TOKEN
        value: admin-secret
      - key: DATABASE_URL
        fromDatabase:
          name: seats-db
          property: connectionString

databases:
  - name: seats-db
    plan: free
