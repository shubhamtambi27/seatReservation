spring.application.name=seat-reservation
server.port=${PORT:8080}

spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/seats}
spring.datasource.username=${DB_USER:seats}
spring.datasource.password=${DB_PASSWORD:seats}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.leak-detection-threshold=20000

server.tomcat.threads.max=80
server.tomcat.accept-count=1000
server.tomcat.max-connections=10000

spring.flyway.enabled=true

management.endpoints.web.exposure.include=health,prometheus,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.prometheus.metrics.export.enabled=true

app.admin-token=${ADMIN_TOKEN:admin-secret}

logging.level.com.shubhamtambi27.seat_reservation=INFO
